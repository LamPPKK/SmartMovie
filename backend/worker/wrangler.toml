name = "smartmovie-catalog"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = false

[env.staging]
name = "smartmovie-catalog-staging"

[env.staging.vars]
AUTH_CALLBACK_ORIGIN = "https://staging-catalog.smartmovie.app"
AUTH_RETURN_URI_ALLOWLIST = "smartmovie://auth/callback,https://staging.smartmovie.app/auth/callback,http://localhost:8080/auth/callback"
WEB_ORIGIN_ALLOWLIST = "https://staging.smartmovie.app,http://localhost:8080"
SESSION_COOKIE_DOMAIN = ".smartmovie.app"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.staging.routes]]
pattern = "staging-catalog.smartmovie.app"
custom_domain = true

[[env.staging.ratelimits]]
name = "CATALOG_RATE_LIMITER"
namespace_id = "1001"

[env.staging.ratelimits.simple]
limit = 120
period = 60

[env.production]
name = "smartmovie-catalog-production"

[env.production.vars]
AUTH_CALLBACK_ORIGIN = "https://catalog.smartmovie.app"
AUTH_RETURN_URI_ALLOWLIST = "smartmovie://auth/callback,https://smartmovie.app/auth/callback"
WEB_ORIGIN_ALLOWLIST = "https://smartmovie.app"
SESSION_COOKIE_DOMAIN = ".smartmovie.app"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.production.routes]]
pattern = "catalog.smartmovie.app"
custom_domain = true

[[env.production.ratelimits]]
name = "CATALOG_RATE_LIMITER"
namespace_id = "1002"

[env.production.ratelimits.simple]
limit = 120
period = 60
