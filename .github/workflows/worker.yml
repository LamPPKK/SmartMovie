name: Catalog Worker

on:
  push:
    branches: [main, develop]
    paths: [backend/worker/**, release/train.json, scripts/verify-release.sh, .github/workflows/worker.yml]
  pull_request:
    branches: [main, develop]
    paths: [backend/worker/**, release/train.json, scripts/verify-release.sh, .github/workflows/worker.yml]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy production after staging smoke tests
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/worker

jobs:
  test:
    name: TypeScript and contract/security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:migrations
      - run: npm test
      - name: Validate Worker bundle and scheduled-trigger configuration
        run: npx wrangler deploy --dry-run --env staging --outdir "${{ runner.temp }}/worker-dry-run"
      - name: Verify release train and contract checksum
        working-directory: ${{ github.workspace }}
        run: ./scripts/verify-release.sh

  staging:
    name: Deploy and smoke staging
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smartmovie-catalog-staging
      cancel-in-progress: false
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      AUTH_D1_DATABASE_ID: ${{ secrets.AUTH_D1_DATABASE_ID }}
      BASE_URL: https://staging-catalog.smartmovie.app
      CLIENT_ID: 00000000-0000-4000-8000-000000000001
      MEDIA_TYPE: movie
      TITLE_ID: "550"
      SEARCH_QUERY: Dune
      ACCOUNT_TEST_MOVIE_ID: "550"
      ACCOUNT_TEST_TV_ID: "1399"
      ACCOUNT_TEST_EPISODE_SERIES_ID: "1399"
      ACCOUNT_TEST_EPISODE_SEASON_NUMBER: "1"
      ACCOUNT_TEST_EPISODE_NUMBER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - name: Configure protected D1 binding
        run: |
          : "${AUTH_D1_DATABASE_ID:?Missing staging AUTH_D1_DATABASE_ID}"
          if [[ ! "$AUTH_D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "AUTH_D1_DATABASE_ID must be a UUID." >&2; exit 1; fi
          cp wrangler.toml wrangler.ci.toml
          printf '\n[[env.staging.d1_databases]]\nbinding = "AUTH_DB"\ndatabase_name = "smartmovie-auth-staging"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$AUTH_D1_DATABASE_ID" >> wrangler.ci.toml
      - name: Set required Worker secrets
        run: |
          : "${TMDB_BEARER_TOKEN:?Missing staging TMDB_BEARER_TOKEN}"
          : "${SESSION_ENCRYPTION_KEY:?Missing staging SESSION_ENCRYPTION_KEY}"
          printf '%s' "$TMDB_BEARER_TOKEN" | npx wrangler secret put TMDB_BEARER_TOKEN --env staging
          printf '%s' "$SESSION_ENCRYPTION_KEY" | npx wrangler secret put SESSION_ENCRYPTION_KEY --env staging
      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply smartmovie-auth-staging --remote --env staging --config wrangler.ci.toml
      - name: Deploy staging Worker
        id: deploy
        run: npx wrangler deploy --env staging --config wrangler.ci.toml
      - name: Smoke schemas, locales, pagination and normalized errors
        run: npm run smoke
      - name: Protected TMDb account smoke and cleanup
        env:
          SMARTMOVIE_ACCOUNT_SESSION_TOKEN: ${{ secrets.SMARTMOVIE_ACCOUNT_SESSION_TOKEN }}
        run: |
          : "${SMARTMOVIE_ACCOUNT_SESSION_TOKEN:?Missing dedicated staging account session}"
          npm run smoke:account
      - name: Roll back staging after a failed smoke test
        if: failure() && steps.deploy.outcome == 'success'
        run: npx wrangler rollback --env staging --config wrangler.ci.toml --message "Automated rollback after staging smoke failure for $GITHUB_SHA" --yes

  production:
    name: Approved production deploy
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smartmovie-catalog-production
      cancel-in-progress: false
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      AUTH_D1_DATABASE_ID: ${{ secrets.AUTH_D1_DATABASE_ID }}
      BASE_URL: https://catalog.smartmovie.app
      CLIENT_ID: 00000000-0000-4000-8000-000000000002
      MEDIA_TYPE: tv
      TITLE_ID: "1399"
      SEARCH_QUERY: Shogun
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/worker/package-lock.json
      - run: npm ci
      - name: Configure protected D1 binding
        run: |
          : "${AUTH_D1_DATABASE_ID:?Missing production AUTH_D1_DATABASE_ID}"
          if [[ ! "$AUTH_D1_DATABASE_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "AUTH_D1_DATABASE_ID must be a UUID." >&2; exit 1; fi
          cp wrangler.toml wrangler.ci.toml
          printf '\n[[env.production.d1_databases]]\nbinding = "AUTH_DB"\ndatabase_name = "smartmovie-auth-production"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$AUTH_D1_DATABASE_ID" >> wrangler.ci.toml
      - name: Require Android main to pin this contract
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_CONTRACT_MANIFEST: https://raw.githubusercontent.com/LamPPKK/Smart-Movie-Android/main/catalog-contract/manifest.json
          ANDROID_RELEASE_MANIFEST: https://raw.githubusercontent.com/LamPPKK/Smart-Movie-Android/main/release/train.json
        run: |
          set -euo pipefail
          local_checksum="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("backend/worker/contract/v2/manifest.json", "utf8")).openapi_sha256)')"
          local_fixtures_checksum="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("backend/worker/contract/v2/manifest.json", "utf8")).fixtures_sha256)')"
          local_contract_version="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("backend/worker/contract/v2/manifest.json", "utf8")).contract_version)')"
          local_version="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("release/train.json", "utf8")).train_version)')"
          remote_manifest="$(curl --fail --retry 3 --retry-all-errors "$ANDROID_CONTRACT_MANIFEST")"
          remote_release="$(curl --fail --retry 3 --retry-all-errors "$ANDROID_RELEASE_MANIFEST")"
          remote_checksum="$(node -e 'console.log(JSON.parse(process.argv[1]).openapi_sha256)' "$remote_manifest")"
          remote_fixtures_checksum="$(node -e 'console.log(JSON.parse(process.argv[1]).fixtures_sha256)' "$remote_manifest")"
          remote_contract_version="$(node -e 'console.log(JSON.parse(process.argv[1]).contract_version)' "$remote_manifest")"
          remote_upstream_commit="$(node -e 'console.log(JSON.parse(process.argv[1]).upstream_commit ?? "")' "$remote_manifest")"
          remote_version="$(node -e 'console.log(JSON.parse(process.argv[1]).train_version)' "$remote_release")"
          if [[ "$local_checksum" != "$remote_checksum" ]]; then
            echo "Android main pins $remote_checksum but production requires $local_checksum." >&2
            exit 1
          fi
          if [[ "$local_fixtures_checksum" != "$remote_fixtures_checksum" ]]; then
            echo "Android main pins fixtures $remote_fixtures_checksum but production requires $local_fixtures_checksum." >&2
            exit 1
          fi
          if [[ "$local_contract_version" != "$remote_contract_version" ]]; then
            echo "Android main pins contract $remote_contract_version but production requires $local_contract_version." >&2
            exit 1
          fi
          if [[ ! "$remote_upstream_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Android main contract provenance is missing its canonical upstream commit." >&2
            exit 1
          fi
          if [[ "$local_version" != "$remote_version" ]]; then
            echo "Android main pins release $remote_version but production requires $local_version." >&2
            exit 1
          fi
      - name: Set required Worker secrets
        run: |
          : "${TMDB_BEARER_TOKEN:?Missing production TMDB_BEARER_TOKEN}"
          : "${SESSION_ENCRYPTION_KEY:?Missing production SESSION_ENCRYPTION_KEY}"
          printf '%s' "$TMDB_BEARER_TOKEN" | npx wrangler secret put TMDB_BEARER_TOKEN --env production
          printf '%s' "$SESSION_ENCRYPTION_KEY" | npx wrangler secret put SESSION_ENCRYPTION_KEY --env production
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply smartmovie-auth-production --remote --env production --config wrangler.ci.toml
      - name: Deploy production Worker
        id: deploy
        run: npx wrangler deploy --env production --config wrangler.ci.toml
      - name: Production contract smoke test
        run: npm run smoke
      - name: Roll back production after a failed smoke test
        if: failure() && steps.deploy.outcome == 'success'
        run: npx wrangler rollback --env production --config wrangler.ci.toml --message "Automated rollback after production smoke failure for $GITHUB_SHA" --yes
