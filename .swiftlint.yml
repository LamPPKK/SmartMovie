included:
  - SmartMovie/Apps
  - SmartMovieKit/Sources
  - SmartMovieKit/Tests

excluded:
  - SmartMovieKit/.build

strict: true
check_for_updates: false
reporter: github-actions-logging

disabled_rules:
  - trailing_comma

identifier_name:
  min_length: 3
  excluded:
    - id
    - tv

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 20
  error: 30

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

force_try:
  severity: error
