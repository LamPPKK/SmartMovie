name: SmartMovie
options:
  bundleIdPrefix: LamNDT
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
    visionOS: "1.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CATALOG_BASE_URL: "https://staging-catalog.smartmovie.app/"
  configs:
    Release:
      CATALOG_BASE_URL: "https://catalog.smartmovie.app/"

packages:
  SmartMovieKit:
    path: ../SmartMovieKit

targetTemplates:
  CatalogApp:
    type: application
    sources:
      - path: Apps/Shared
      - path: SmartMovie/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: SmartMovieKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CATALOG_BASE_URL: "$(CATALOG_BASE_URL)"
        INFOPLIST_KEY_CFBundleDisplayName: "$(PRODUCT_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true

targets:
  SmartMovie:
    templates: [CatalogApp]
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/Universal
    dependencies:
      - target: SmartMovieWatch
        embed: true
        link: false
        platformFilter: iOS
    entitlements:
      path: Apps/Universal/SmartMovie.entitlements
    settings:
      base:
        PRODUCT_NAME: SmartMovie
        PRODUCT_BUNDLE_IDENTIFIER: LamNDT.SmartMovie
        SUPPORTS_MACCATALYST: true
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  SmartMovieTV:
    templates: [CatalogApp]
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/Universal
    entitlements:
      path: Apps/Universal/SmartMovie.entitlements
    settings:
      base:
        PRODUCT_NAME: SmartMovie
        PRODUCT_BUNDLE_IDENTIFIER: LamNDT.SmartMovie
        TARGETED_DEVICE_FAMILY: "3"

  SmartMovieNativeMac:
    templates: [CatalogApp]
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/NativeMac
    entitlements:
      path: Apps/NativeMac/SmartMovieNative.entitlements
    settings:
      base:
        PRODUCT_NAME: "SmartMovie for Mac"
        PRODUCT_BUNDLE_IDENTIFIER: LamNDT.SmartMovie.NativeMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment

  SmartMovieWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/Watch
      - path: SmartMovie/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SmartMovie
        PRODUCT_BUNDLE_IDENTIFIER: LamNDT.SmartMovie.watchkitapp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: SmartMovie
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: LamNDT.SmartMovie
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        INFOPLIST_KEY_WKWatchKitApp: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"

  SmartMovieVision:
    templates: [CatalogApp]
    platform: visionOS
    deploymentTarget: "1.0"
    sources:
      - path: Apps/Vision
    entitlements:
      path: Apps/Vision/SmartMovieVision.entitlements
    settings:
      base:
        PRODUCT_NAME: SmartMovie
        PRODUCT_BUNDLE_IDENTIFIER: LamNDT.SmartMovie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment

schemes:
  SmartMovie:
    build:
      targets:
        SmartMovie: all
    run:
      config: Debug
    archive:
      config: Release
  SmartMovieTV:
    build:
      targets:
        SmartMovieTV: all
    run:
      config: Debug
    archive:
      config: Release
  SmartMovieNativeMac:
    build:
      targets:
        SmartMovieNativeMac: all
    run:
      config: Debug
    archive:
      config: Release
  SmartMovieWatch:
    build:
      targets:
        SmartMovieWatch: all
    run:
      config: Debug
    archive:
      config: Release
  SmartMovieVision:
    build:
      targets:
        SmartMovieVision: all
    run:
      config: Debug
    archive:
      config: Release
